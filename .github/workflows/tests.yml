name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      # Both interfaces print Chinese, including the English one: the phrase
      # "English 中文" appears in its own description. A console on a legacy
      # code page must not turn that into a crash.
      - name: Check that the command line starts in both languages
        run: |
          python swbilingual-cli.py --help
          python swbilingual-cli.py --lang zh --help

      - name: Check the command line on a console without Chinese
        env:
          PYTHONIOENCODING: cp1252
        run: |
          python swbilingual-cli.py --help
          python swbilingual-cli.py --lang zh --help

  interface:
    name: Desktop interface (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build every widget and render both languages
        run: python tests\gui_smoke.py

      - name: Photograph the interface
        shell: pwsh
        run: |
          $english = Start-Process python -ArgumentList 'tests\gui_smoke.py','--hold','20','--language','en' -PassThru
          .\.github\scripts\capture-screen.ps1 -Path screenshot-en.png -ProcessId $english.Id
          $english.WaitForExit()

          $chinese = Start-Process python -ArgumentList 'tests\gui_smoke.py','--hold','20','--language','zh' -PassThru
          .\.github\scripts\capture-screen.ps1 -Path screenshot-zh.png -ProcessId $chinese.Id
          $chinese.WaitForExit()

      - name: Upload the screenshots
        uses: actions/upload-artifact@v7
        with:
          name: interface-screenshots
          path: screenshot-*.png
          if-no-files-found: warn
